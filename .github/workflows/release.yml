name: release

# 打 tag（v0.1.0）即发布；也可以手动触发。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross 负责 musl 交叉链接：静态产物不挑发行版的 glibc 版本。
      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          tar -czf "$GITHUB_WORKSPACE/rgc-agent-linux-${{ matrix.arch }}.tar.gz" rgc-agent
          cd "$GITHUB_WORKSPACE"
          sha256sum rgc-agent-linux-${{ matrix.arch }}.tar.gz > rgc-agent-linux-${{ matrix.arch }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rgc-agent-linux-${{ matrix.arch }}
          path: |
            rgc-agent-linux-${{ matrix.arch }}.tar.gz
            rgc-agent-linux-${{ matrix.arch }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            scripts/install.sh
          generate_release_notes: true
